name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for release notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # obsidian-workflows always creates a draft with no notes, and Obsidian
      # can't see drafts. Add notes and publish so tag and release go live together.
      # Notes come from the annotated tag message (git tag -a 1.2.3 -m "...");
      # otherwise they fall back to commit subjects since the previous tag.
      - name: Publish release
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          fi
          if [ ! -s notes.md ] || [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME" \
              | grep -v -E '^- (ci|chore)(\(|:)' > notes.md || true
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
